[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BlickUtils"
version = "26.6.25"
description = "A collection of utility functions for Blick Technologies"
authors = [{ name = "Horst E.", email = "horst@blicktek.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]   

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

dependencies = [
    "httpx>=0.1.0",
    "tqdm",
    "Pillow",
    "pillow-heif",
]

